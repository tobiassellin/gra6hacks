<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26173e"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="viceSun" x1="60" y1="22" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="55%" stop-color="#ff7e5f"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="boxEdge" x1="26" y1="12" x2="94" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="20" fill="url(#bgGlow)" stroke="rgba(0,229,255,0.35)" stroke-width="2"/>
  <!-- 3D Game Case Shadow & Spine -->
  <rect x="30" y="14" width="64" height="92" rx="6" fill="#09070f" stroke="url(#boxEdge)" stroke-width="2.5"/>
  <path d="M30 26H94" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Top Console Header Strip -->
  <rect x="31.5" y="15.5" width="61" height="10" rx="4" fill="#00e5ff" fill-opacity="0.18"/>
  <text x="62" y="23" text-anchor="middle" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.5">PS5 · XBOX</text>
  <!-- Vice Sun Disc -->
  <circle cx="62" cy="56" r="21" fill="url(#viceSun)"/>
  <line x1="40" y1="58" x2="84" y2="58" stroke="#09070f" stroke-width="2"/>
  <line x1="40" y1="63" x2="84" y2="63" stroke="#09070f" stroke-width="2.5"/>
  <line x1="40" y1="68" x2="84" y2="68" stroke="#09070f" stroke-width="3"/>
  <!-- Roman Numeral VI -->
  <text x="62" y="64" text-anchor="middle" fill="#f5f3ff" stroke="#09070f" stroke-width="1.5" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="1">VI</text>
  <!-- Bottom Edition Tag -->
  <rect x="38" y="86" width="48" height="13" rx="6.5" fill="#ff2a85"/>
  <text x="62" y="95" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.8">19 NOV</text>
</svg>
